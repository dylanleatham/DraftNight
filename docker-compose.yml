# Local development / demo stack.
#
#   docker compose up --build          # full app at http://localhost:8080
#   docker compose up -d sqlserver     # database only (for `dotnet run` + `npm run dev`)
#
# The SA password below is a throwaway for a local container only. Override it by
# setting MSSQL_SA_PASSWORD in your shell or a .env file (see .env.example).
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: draftapp-sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-DraftApp_Dev123!}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: .
    container_name: draftapp-app
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=DraftApp;User Id=sa;Password=${MSSQL_SA_PASSWORD:-DraftApp_Dev123!};TrustServerCertificate=True
    ports:
      - "8080:8080"

volumes:
  sqlserver-data:
